name: Build and push to dockerhub with a generated name, then prepare draft release on GitHub.

on:
  workflow_dispatch:

jobs:
  coolname:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      name: ${{ steps.generator.outputs.name }}
    steps:
      - name: Generate name
        uses: thclark/coolname-generator-action@main
        id: generator
        with:
          separator: "-"
          length: "2"
          style: "lowerCase"

  docker:
    needs: coolname
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        gdal: ["3.10.0"]
        proj: ["9.6.0"]
        uv: ["0.7.7"]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate name
        uses: thclark/coolname-generator-action@main
        id: generator
        with:
          separator: "-"
          length: "2"
          style: "lowerCase"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push slim image
        uses: docker/build-push-action@v6.9.0
        id: build_push_slim
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            PYTHON_SHORT_VERSION=${{ matrix.python }}
            GDAL_VERSION=${{ matrix.gdal }}
            PROJ_VERSION=${{ matrix.proj }}
            BASE_IMAGE=python:${{ matrix.python }}-slim-bookworm
            DEV_BASE_IMAGE=mcr.microsoft.com/vscode/devcontainers/python:1-${{ matrix.python }}-bookworm
            UV_IMAGE=ghcr.io/astral-sh/uv:${{ matrix.uv }}
          target: slim
          push: true
          tags: windpioneers/gdal-python:${{ needs.coolname.outputs.name }}-gdal-${{ matrix.gdal }}-python-${{ matrix.python }}-slim

      - name: Build and push slim debug image
        uses: docker/build-push-action@v6.9.0
        id: build_push_slim_debug
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            PYTHON_SHORT_VERSION=${{ matrix.python }}
            GDAL_VERSION=${{ matrix.gdal }}
            PROJ_VERSION=${{ matrix.proj }}
            BASE_IMAGE=python:${{ matrix.python }}-slim-bookworm
            DEV_BASE_IMAGE=mcr.microsoft.com/vscode/devcontainers/python:1-${{ matrix.python }}-bookworm
            UV_IMAGE=ghcr.io/astral-sh/uv:${{ matrix.uv }}
          target: slim-debug
          push: true
          tags: windpioneers/gdal-python:${{ needs.coolname.outputs.name }}-gdal-${{ matrix.gdal }}-python-${{ matrix.python }}-slim-debug

      - name: Build and push dev image
        uses: docker/build-push-action@v6.9.0
        id: build_push_dev
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            PYTHON_SHORT_VERSION=${{ matrix.python }}
            GDAL_VERSION=${{ matrix.gdal }}
            PROJ_VERSION=${{ matrix.proj }}
            BASE_IMAGE=python:${{ matrix.python }}-slim-bookworm
            DEV_BASE_IMAGE=mcr.microsoft.com/vscode/devcontainers/python:1-${{ matrix.python }}-bookworm
            UV_IMAGE=ghcr.io/astral-sh/uv:${{ matrix.uv }}
          target: dev
          push: true
          tags: windpioneers/gdal-python:${{ needs.coolname.outputs.name }}-gdal-${{ matrix.gdal }}-python-${{ matrix.python }}-dev

      # - name: Duplicate image from DockerHub to GCR
      #  TODO as we've used buildx we can copy the image to gcr.io with the same hash. See:
      #    - https://ianwhitestone.work/docker-builds-gcr-github-actions/
      #    - https://github.com/docker/build-push-action/blob/master/docs/advanced/copy-between-registries.md

      - name: Image digests
        run: |
          echo "slim: ${{ steps.build_push_slim.outputs.digest }}"
          echo "slim-debug: ${{ steps.build_push_slim_debug.outputs.digest }}"
          echo "dev: ${{ steps.build_push_dev.outputs.digest }}"

  release:
    needs: [coolname, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, no need to create your own.
        with:
          tag_name: ${{ needs.coolname.outputs.name }}
          release_name: ${{ needs.coolname.outputs.name }}
          draft: true
